version: "2"

# Some linters and settings come from https://github.com/maratori/golangci-lint-config

issues:
  max-issues-per-linter: 0
  max-same-issues: 0 # the default of 3 hides repeated issues

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - depguard
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - gomoddirectives
    - goprintffuncname
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # too strict
        - shadow # too noisy
    nolintlint:
      require-explanation: true
      require-specific: true
    perfsprint:
      strconcat: false
      error-format: false
    usetesting:
      os-temp-dir: true
    depguard:
      rules:
        deprecated:
          list-mode: lax
          files:
            - "$all"
          deny:
            - pkg: github.com/golang/protobuf
              desc: use google.golang.org/protobuf
            - pkg: github.com/satori/go.uuid
              desc: use github.com/google/uuid
        randv2:
          list-mode: lax
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: use math/rand/v2
        viewmodel:
          list-mode: lax
          files:
            - "**/ui/pages/**/viewmodel*.go"
            - "**/ui/components/emulatorform/viewmodel.go"
            - "!$test"
          deny:
            - pkg: github.com/egoist/mygo
              desc: a ViewModel holds no widgets, dialogs or windows; the view draws them
            - pkg: github.com/akfaiz/carryover/ui/i18n
              desc: a ViewModel holds no translated text; the view translates
            - pkg: github.com/akfaiz/carryover/ui/shell
              desc: pages do not know the shell
        toolkit-free:
          list-mode: lax
          files:
            - "**/ui/pages/**/viewmodel*.go"
            - "**/ui/pages/**/backend.go"
            - "**/ui/pages/cloud/wizard.go"
            - "**/ui/components/emulatorform/viewmodel.go"
            - "**/ui/store/**"
            - "**/ui/envcore/**"
            - "**/ui/i18n/**"
            - "**/ui/textutil/**"
            - "!$test"
          deny:
            - pkg: github.com/egoist/mygo
              desc: ViewModels, backends, store, envcore, i18n and textutil import no GUI toolkit (see ui/envcore TestToolkitFree)
            - pkg: github.com/akfaiz/carryover/ui/kit
              desc: kit draws with the toolkit; use ui/textutil for plain helpers
            - pkg: github.com/akfaiz/carryover/ui/env$
              desc: env names the window and the toolkit; hold envcore.Services instead
            - pkg: github.com/akfaiz/carryover/ui/components
              desc: components draw with the toolkit; use ui/textutil for plain helpers
        pages:
          list-mode: lax
          files:
            - "**/ui/pages/**"
            - "!$test"
          deny:
            - pkg: github.com/akfaiz/carryover/ui/shell
              desc: a page reaches the window through env.Env, not the shell
            - pkg: github.com/akfaiz/carryover/ui/pages
              desc: pages do not import each other; use env.Navigate
        kit:
          list-mode: lax
          files:
            - "**/ui/kit/**"
            - "!$test"
          deny:
            - pkg: github.com/akfaiz/carryover/ui/i18n
              desc: kit has no user-visible text; callers pass labels in
            - pkg: github.com/akfaiz/carryover/services
              desc: kit is the toolkit layer only
            - pkg: github.com/akfaiz/carryover/internal/core
              desc: kit is the toolkit layer only
            - pkg: github.com/akfaiz/carryover/ui
              desc: kit is the bottom layer
        services-only:
          list-mode: lax
          files:
            - "**/ui/components/**"
            - "**/ui/flows/**"
            - "**/ui/pages/**"
            - "**/ui/prompts/**"
            - "**/ui/store/**"
            - "**/ui/env/**"
            - "!$test"
          deny:
            - pkg: github.com/akfaiz/carryover/internal/core
              desc: reach the core through services (re-export what you need in services/aliases.go)
            - pkg: github.com/akfaiz/carryover/internal/library
              desc: reach the library through services (see services/aliases.go)
            - pkg: github.com/akfaiz/carryover/internal/launcher
              desc: reach the launcher through services (see services/aliases.go)
            - pkg: github.com/akfaiz/carryover/internal/stores
              desc: reach the stores through services (see services/aliases.go)
        lower-layers:
          list-mode: lax
          files:
            - "**/ui/store/**"
            - "**/ui/env/**"
            - "!$test"
          deny:
            - pkg: github.com/akfaiz/carryover/ui/pages
              desc: store and env sit below the pages
            - pkg: github.com/akfaiz/carryover/ui/shell
              desc: store and env sit below the shell
            - pkg: github.com/akfaiz/carryover/ui/components
              desc: store and env sit below the components
            - pkg: github.com/akfaiz/carryover/ui/flows
              desc: store and env sit below the flows
        components:
          list-mode: lax
          files:
            - "**/ui/components/**"
            - "!$test"
          deny:
            - pkg: github.com/akfaiz/carryover/ui/flows
              desc: flows are built on components, not the other way round
            - pkg: github.com/akfaiz/carryover/ui/pages
              desc: components sit below the pages
            - pkg: github.com/akfaiz/carryover/ui/shell
              desc: components sit below the shell
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - os.Remove
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    presets:
      - std-error-handling
    rules:
      # A failed type assertion in a test panics, which fails the test anyway.
      - path: '_test\.go'
        source: '\.\([^)]'
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/akfaiz/carryover
