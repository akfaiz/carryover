name: Release

# Push a version tag to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags with a suffix (v0.2.0-rc1) are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: ci
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit # keep setup-go's Go on PATH
      - name: Stamp version
        shell: bash
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Package
        shell: msys2 {0}
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}" # the exe's version info takes x.y.z only
          go tool fyne package --os windows --release --name carryover \
            --app-version "$version" --app-build "$GITHUB_RUN_NUMBER"
          # Release files are named carryover-<version>-<os>-<arch>.<ext>, version without the "v".
          mkdir -p dist
          mv carryover.exe "dist/carryover-${GITHUB_REF_NAME#v}-windows-amd64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: ci
    # Same Dockerfile as scripts/linux-docker (Debian bookworm, appimagetool pinned
    # there), so the release is the build already tested on the Steam Deck.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Stamp version
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Build AppImage and binary
        run: |
          name="carryover-${GITHUB_REF_NAME#v}-linux-amd64"
          echo "NAME=$name" >> "$GITHUB_ENV"
          # AppImageUpdate / Gear Lever look for the .zsync file in the latest release;
          # the wildcard matches whatever version that is.
          update_info="gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|latest|carryover-*-linux-amd64.AppImage.zsync"
          # The AppImage gets its final name here, not by renaming it later: the .zsync file refers to it by name.
          docker buildx build --target appimage-out --build-arg "UPDATE_INFO=$update_info" \
            --build-arg "APPIMAGE=$name.AppImage" --output type=local,dest=out .
          docker buildx build --target binary-out --output type=local,dest=out .
      - name: Package
        run: |
          mkdir -p dist
          mv "out/$NAME.AppImage" "out/$NAME.AppImage.zsync" dist/
          packaging/linux/tarball.sh out/carryover "$NAME" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
