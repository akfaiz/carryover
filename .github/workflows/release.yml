name: Release

# Push a version tag to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags with a suffix (v0.2.0-rc1) are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# No CI run here: tags are made on main, where every change has passed CI when it was merged.
jobs:
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit # keep setup-go's Go on PATH
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Stamp version
        shell: bash
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      # The portable exe and the installer, the same way as a local build.
      # Release files are named carryover-<version>-<os>-<arch>.<ext>, version without the "v".
      - name: Package
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          ./scripts/windows-package.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '') -Build $env:GITHUB_RUN_NUMBER
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    # Same Dockerfile as scripts/linux-docker (Debian bookworm, appimagetool pinned
    # there), so the release is the build already tested on the Steam Deck.
    runs-on: ubuntu-latest
    env:
      # build-push-action otherwise uploads a build record (*.dockerbuild) as a run artifact.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Stamp version
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Names
        run: |
          name="carryover-${GITHUB_REF_NAME#v}-linux-amd64"
          echo "NAME=$name" >> "$GITHUB_ENV"
          # AppImageUpdate / Gear Lever look for the .zsync file in the latest release;
          # the wildcard matches whatever version that is.
          echo "UPDATE_INFO=gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|latest|carryover-*-linux-amd64.AppImage.zsync" >> "$GITHUB_ENV"
      # The AppImage gets its final name here, not by renaming it later: the .zsync file refers to it by name.
      - name: Build AppImage
        uses: docker/build-push-action@v7
        with:
          context: . # not the git context: it would miss the git-ignored version stamp
          target: appimage-out
          build-args: |
            UPDATE_INFO=${{ env.UPDATE_INFO }}
            APPIMAGE=${{ env.NAME }}.AppImage
          outputs: type=local,dest=dist
      - name: Build binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binary-out
          outputs: type=local,dest=dist/linux
      - name: Package
        run: |
          packaging/linux/tarball.sh dist/linux/carryover "$NAME" dist
          rm -rf dist/linux # only the release files stay in dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest # Apple Silicon; the script cross-builds the Intel half
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Stamp version
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      # A universal Carryover.app in a disk image, the same way as a local build.
      - name: Package
        run: scripts/macos-package.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Stamp version
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      # The signing key, from the repository secrets (see CONTRIBUTING.md, "Android"):
      # every release must be signed with the same key, or installed apps can't update.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CARRYOVER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the CARRYOVER_KEYSTORE_BASE64, CARRYOVER_KEYSTORE_PASSWORD and CARRYOVER_KEY_ALIAS secrets to sign the Android release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/carryover.jks"
          echo "CARRYOVER_KEYSTORE=$RUNNER_TEMP/carryover.jks" >> "$GITHUB_ENV"
      # Signed APKs per ABI: carryover-<version>-android-<abi>.apk. The version code is
      # x*1000000 + y*10000 + z*100 + build, with build = N for a -rcN (or other -xxxN)
      # pre-release and 99 for the release, so an rc updates to its release.
      - name: Package
        env:
          CARRYOVER_KEYSTORE_PASSWORD: ${{ secrets.CARRYOVER_KEYSTORE_PASSWORD }}
          CARRYOVER_KEY_ALIAS: ${{ secrets.CARRYOVER_KEY_ALIAS }}
          CARRYOVER_KEY_PASSWORD: ${{ secrets.CARRYOVER_KEY_PASSWORD }}
        run: |
          version=${GITHUB_REF_NAME#v}
          build=99
          if [[ $version == *-* ]]; then
            n=$(grep -o '[0-9]*$' <<<"$version" || true)
            build=$(( 10#${n:-0} > 98 ? 98 : 10#${n:-0} ))
          fi
          scripts/android-build.sh --release --version "$version" --build "$build"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only the release files: other run artifacts (e.g. Docker build records) aren't zips.
          pattern: "{windows,linux,macos,android}"
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
