name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  workflow_call: # the release workflow runs these checks first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols # same as the Dockerfile
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols # same as the Dockerfile
      - name: Install MinGW gcc (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit # keep setup-go's Go on PATH

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: go test -coverprofile=coverage.txt ./...
      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux' # one report is enough
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          fail_ci_if_error: false # forks and the release workflow have no token
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test ./...
