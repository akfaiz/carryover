name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest] # macOS lints its own _darwin.go files
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0" # the GUI needs no C compiler or GUI libraries to build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test (Linux, with coverage)
        if: runner.os == 'Linux'
        run: go test -coverprofile=coverage.txt ./...
      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux' # one report is enough
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          fail_ci_if_error: false # forks have no token

  # The Android app: the Go core bound with gomobile (the runner's Android SDK
  # and newest NDK), the Kotlin unit tests and Android lint, and the debug APKs
  # as a run artifact for testing. The Go side of mobile/ is tested above.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the APKs are named after `git describe`
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build (Go core and debug APKs)
        run: scripts/android-build.sh
      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug -Pcarryover.abis=arm64-v8a,x86_64
      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
