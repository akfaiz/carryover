name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  workflow_call: # the release workflow runs these checks first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols # same as the Dockerfile
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols # same as the Dockerfile
      - name: Install MinGW gcc (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit # keep setup-go's Go on PATH

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: go test ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test ./...

  # Fills the caches the release's Linux build restores (see release.yml). A tag run can
  # only restore caches saved on main, so this runs on pushes to main and nowhere else
  # (not on pull requests, and skipped when release.yml calls this workflow from a tag).
  docker-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Go module and build caches used by the Dockerfile's RUN --mount=type=cache.
      # A new key per run, so the cache follows main; restore-keys pick the newest.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/docker-go
          key: docker-go-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            docker-go-${{ hashFiles('go.sum') }}-
            docker-go-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "${{ runner.temp }}/docker-go/mod": "/go/pkg/mod",
              "${{ runner.temp }}/docker-go/build": "/root/.cache/go-build"
            }
      # The appimage stage builds on the build stage, so this caches every layer the
      # release needs (base image, apt, appimagetool, go mod download).
      - name: Build Docker layers
        uses: docker/build-push-action@v6
        with:
          context: .
          target: appimage
          outputs: type=cacheonly
          cache-from: type=gha,scope=linux
          cache-to: type=gha,scope=linux,mode=max
