name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, rather than the solution. For example "I play the same game on two PCs and ...".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Optional, if you're not sure.
  - type: dropdown
    id: platform
    attributes:
      label: Platforms this is about
      multiple: true
      options:
        - Windows
        - Steam Deck
        - Linux (other)
